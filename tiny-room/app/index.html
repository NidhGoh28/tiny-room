<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>Tiny Room</title>
<link rel="stylesheet" href="room.css">
</head>
<body>
<main class="stage" id="stage">
  <canvas id="room" width="176" height="146" aria-label="A tiny pixel room showing your Mac's status"></canvas>
  <div class="tip" id="tip" hidden></div>
  <div class="clock" id="clock">--:--</div>
  <section class="card" id="card" hidden role="dialog" aria-live="polite">
    <button class="x" id="cardX" type="button" aria-label="Close">×</button>
    <h2 id="cTitle"></h2>
    <div class="big" id="cBig"></div>
    <p id="cSub"></p>
    <canvas id="spark" width="120" height="24" hidden></canvas>
    <button class="act" id="cAct" type="button" hidden></button>
  </section>
</main>
<script src="room.js"></script>
</body>
</html>
